<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCM</title>
  <link rel="stylesheet" href="estilos.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='index.html'">VCM</div>
    <div class="search-container">
      <input type="text" placeholder="Buscar productos" class="search-bar" id="search-bar"/>
    </div>
    <div class="menu-bajo">
      <nav class="menu">
        <div class="menu-item" onclick="toggleCategorias()">Categorías</div>
        <div class="menu-item" onclick="location.href='carrito.html'">🛒</div>
      </nav>
    </div>
    <div class="categorias" id="categorias">
      <div class="categoria">Ofertas Destacadas</div>
      <div class="categoria">Más Buscados</div>
    </div>
  </header>

  <section class="banner-carrusel">
    <div class="banner-track" id="banner-track">
      <div class="banner-item">Mate Camionero</div>
      <div class="banner-item">Termo Acero</div>
      <div class="banner-item">Botella Personalizada</div>
      <!-- duplicados para efecto infinito -->
      <div class="banner-item">Mate Camionero</div>
      <div class="banner-item">Termo Acero</div>
      <div class="banner-item">Botella Personalizada</div>
    </div>
  </section>

  <main>
    <section class="productos">
      <h2>Ofertas Destacadas</h2>
      <div class="productos-carrusel">
        <div class="producto">Termo Vacio</div>
        <div class="producto">Mate de Madera</div>
        <div class="producto">Set Matero</div>
      </div>
    </section>

    <section class="productos">
      <h2>Más Buscados</h2>
      <div class="productos-carrusel">
        <div class="producto">Bolígrafo VCM</div>
        <div class="producto">Botella Deportiva</div>
        <div class="producto">Remera con Logo</div>
      </div>
    </section>
  </main>

  <a href="https://wa.me/549123456789" class="whatsapp-button" target="_blank">WhatsApp</a>

</body>
</html>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }
  header {
    background: #f75b68;
    color: white;
    padding: 1rem;
    text-align: center;
    position: relative;
  }
  .logo {
    font-size: 2rem;
    cursor: pointer;
  }
  .search-container {
    display: flex;
    justify-content: center;
    margin-top: 1rem;
  }
  .search-bar {
    width: 50%;
    padding: 0.5rem;
    border-radius: 20px;
    border: none;
    transition: width 0.3s;
  }
  .search-bar:focus {
    width: 60%;
    outline: none;
  }
  .menu-bajo {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1rem;
  }
  .menu-item {
    cursor: pointer;
    font-weight: bold;
  }
  .categorias {
    display: none;
    background: #fff;
    color: #333;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    padding: 1rem;
  }
  .categorias.mostrar {
    display: flex;
    justify-content: center;
    gap: 2rem;
  }
  .banner-carrusel {
    overflow: hidden;
    background: #eee;
    padding: 1rem 0;
  }
  .banner-track {
    display: flex;
    animation: scrollBanner 20s linear infinite;
    gap: 2rem;
  }
  .banner-item {
    min-width: 200px;
    background: #ccc;
    padding: 1rem;
    border-radius: 10px;
    text-align: center;
  }
  @keyframes scrollBanner {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .productos {
    padding: 2rem;
  }
  .productos-carrusel {
    display: flex;
    gap: 1rem;
    overflow-x: auto;
  }
  .producto {
    min-width: 150px;
    background: #f2f2f2;
    padding: 1rem;
    border-radius: 10px;
    text-align: center;
  }
  .whatsapp-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25d366;
    color: white;
    padding: 1rem;
    border-radius: 50%;
    text-decoration: none;
    font-size: 1.5rem;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }
</style>

<script>
  function toggleCategorias() {
    document.getElementById('categorias').classList.toggle('mostrar');
  }

  // Cerrar menú al hacer clic fuera
  document.addEventListener('click', function(e) {
    const cat = document.getElementById('categorias');
    const menu = e.target.closest('.menu-item');
    if (!menu && !e.target.closest('.categorias')) {
      cat.classList.remove('mostrar');
    }
  });
</script>
