<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Reset y diseño base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
    }

    header .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    /* Barra de búsqueda sin borde negro y más larga */
    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 300px; /* Aumentado el tamaño */
    }

    /* Menú y submenú */
    .menu {
      display: flex;
      gap: 2rem;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    /* Submenú dentro de Categorías */
    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 50px;
      left: 0;
      min-width: 200px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
    }

    .categories-container {
      position: relative;
    }

    .categories-container:hover .submenu {
      display: block;
    }

    /* Hero Section con color Phantom F75B68 (Rosa) */
    .hero {
      background-color: #F75B68; /* Phantom F75B68 - Rosa */
      color: white;
      padding: 3rem 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
    }

    footer {
      background-color: #F75B68;
      color: white;
      padding: 2rem 0;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      margin: 0 1rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header con logo, barra de búsqueda y menú -->
  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías">
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a href="#">Categorías</a>
        <div class="submenu">
          <a href="#">Subcategoría 1</a>
          <a href="#">Subcategoría 2</a>
          <a href="#">Subcategoría 3</a>
        </div>
      </div>
      <a href="#">Catálogos</a>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
  </header>

  <!-- Hero Section con color Phantom F75B68 (Rosa) -->
  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explora nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 VCM. Todos los derechos reservados.</p>
    <nav>
      <a href="#">Política de privacidad</a>
      <a href="#">Términos de uso</a>
      <a href="#">Contactanos</a>
    </nav>
  </footer>

</body>
</html>
