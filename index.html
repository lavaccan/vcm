<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Reset y diseño base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
    }

    header .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    /* Barra de búsqueda sin borde negro y más larga */
    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 400px; /* Aumentado el tamaño */
    }

    /* Menú y submenú */
    .menu {
      display: flex;
      gap: 2rem;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    /* Submenú dentro de Categorías */
    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 50px;
      left: 0;
      min-width: 200px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
    }

    .categories-container {
      position: relative;
    }

    /* Hero Section con color Phantom F75B68 (Rosa) */
    .hero {
      background-color: #F75B68; /* Phantom F75B68 - Rosa */
      color: white;
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
    }

    /* Estilos para el slider */
    .slider {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .slider img {
      width: 100%;
      height: auto;
      display: block;
    }

    .slider .slides {
      display: flex;
      transition: transform 1s ease-in-out;
    }

    .slider .slide {
      min-width: 100%;
    }

    .slider .prev, .slider .next {
