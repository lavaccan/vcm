<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* Estilos generales */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 500px;
    }

    .menu {
      display: flex;
      gap: 2rem;
      position: relative;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    .categories-container {
      position: relative;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 0.5rem 1rem;
      top: 35px;
      left: 0;
      min-width: 200px;
      z-index: 10;
      border-radius: 10px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin: 0.5rem 0;
      font-size: 0.9rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15); /* Sombra al 15% */
    }

    .submenu a:hover {
      color: #F75B68;
    }

    .hero {
      background-color: #F75B68;
      color: white;
      text-align: center;
      padding: 2rem;
    }

    /* Resto de tus estilos... */
  </style>
</head>
<body>

  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías" />
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#" onclick="setCategoryCookie('Zapatillas')">Zapatillas</a>
          <a href="#" onclick="setCategoryCookie('Remeras')">Remeras</a>
          <a href="#" onclick="setCategoryCookie('Pantalones')">Pantalones</a>
          <a href="#" onclick="setCategoryCookie('Buzos')">Buzos</a>
          <a href="#" onclick="setCategoryCookie('Camperas')">Camperas</a>
          <a href="#" onclick="setCategoryCookie('Shorts')">Shorts</a>
          <a href="#" onclick="setCategoryCookie('Calzas')">Calzas</a>
          <a href="#" onclick="setCategoryCookie('Tops')">Tops</a>
          <a href="#" onclick="setCategoryCookie('Ojotas')">Ojotas</a>
          <a href="#" onclick="setCategoryCookie('Mochilas')">Mochilas</a>
          <a href="#" onclick="setCategoryCookie('Gorras')">Gorras</a>
          <a href="#" onclick="setCategoryCookie('Pelotas')">Pelotas</a>
        </div>
      </div>
      <a href="#">Catálogos</a>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explora nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <!-- Resto del contenido aquí -->

  <script>
    function toggleSubmenu() {
      const submenu = document.getElementById('submenu');
      submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
    }

    // Cierra el menú si se hace clic fuera
    document.addEventListener('click', function(event) {
      const submenu = document.getElementById('submenu');
      const categories = document.querySelector('.categories-container');
      if (!categories.contains(event.target)) {
        submenu.style.display = 'none';
      }
    });

    // Función para establecer una cookie con la categoría seleccionada
    function setCategoryCookie(category) {
      document.cookie = "selectedCategory=" + encodeURIComponent(category) + "; path=/";
      // Aquí puedes redirigir a la página correspondiente si lo deseas
      // window.location.href = "/categoria/" + encodeURIComponent(category);
    }
  </script>
</body>
</html>
