<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCM Marking</title>
  <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-principal: #F14D68;
      --color-secundario: #fff;
      --color-gris: #f8f9fa;
      --texto-oscuro: #222;
      --texto-claro: #fff;
      --gris-sec: #888;
      --sombra: 0 3px 15px #0001;
      --borde-banner: #fef1f6;
    }
    body { margin:0; font-family:'Nunito Sans',Arial,sans-serif; background:#fff; color:var(--texto-oscuro); }
    /* --- Barra de cantidad moderna --- */
    .counter-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      border-radius: 22px;
      box-shadow: 0 1px 6px #f14d6812;
      padding: 4px 10px;
      gap: 10px;
      width: 110px;
      margin: 10px auto 14px auto;
      transition: box-shadow 0.18s;
    }
    .counter-btn {
      background: var(--color-principal);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s, transform 0.13s, box-shadow 0.18s;
      box-shadow: 0 2px 8px #f14d6822;
      outline: none;
      user-select: none;
    }
    .counter-btn:active {
      transform: scale(0.93);
      background: #d9274e;
      box-shadow: 0 1px 4px #f14d6844;
    }
    .counter-btn:disabled {
      background: #eee;
      color: #bbb;
      cursor: not-allowed;
      box-shadow: none;
    }
    .counter-value {
      width: 32px;
      text-align: center;
      font-size: 1.13rem;
      font-weight: 700;
      color: #222;
      background: transparent;
      border: none;
      outline: none;
      pointer-events: none;
      user-select: none;
    }
    /* --- Tarjeta de producto --- */
    .product-card {
      background: var(--color-secundario);
      border-radius: 16px;
      padding: 17px 12px 15px 12px;
      box-shadow: 0 2px 22px #0000000c;
      border: 1.5px solid #f9d6dd;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: .18s;
      position: relative;
    }
    .product-card img { width:100%; height:145px; object-fit:contain; background:#ffe5f0; border-radius:10px; margin-bottom:10px; }
    .product-name { color:#1b1b1b; font-weight:600; margin-bottom:12px; font-size:1.09rem; text-align:center; min-height:38px; }
    .product-btn {
      background:var(--color-principal); color:#fff; font-weight:600; padding:8px 18px; border-radius:7px; border:none;
      cursor:pointer; font-size:1rem; letter-spacing:.7px; transition:background .16s, color .16s; box-shadow:0 2px 10px #0001;
      margin-top: 8px;
    }
    .product-btn:hover { background:#d9274e; }
    /* --- Grid de productos --- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
      gap: 30px;
    }
    /* --- Navbar y otros estilos igual que antes... --- */
    .nivel-uno {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      height: 84px;
      padding: 0 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 999;
      gap: 22px;
    }
    .navbar-auth {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-left: 18px;
    }
    .auth-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      color: var(--color-principal);
      border: 2px solid var(--color-principal);
      border-radius: 22px;
      padding: 7px 18px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.22s, color 0.22s, box-shadow 0.22s, transform 0.18s;
      box-shadow: 0 2px 12px #f14d681a;
      outline: none;
      position: relative;
      overflow: hidden;
    }
    .auth-btn:hover, .auth-btn:focus {
      background: var(--color-principal);
      color: #fff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 18px #f14d6844;
    }
    /* ...otros estilos de tu navbar y página... */
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar nivel-uno">
    <div>
      <span style="font-family:'Montserrat',sans-serif; font-size:2rem; font-weight:700; color:#212121; letter-spacing:2px;">
        VCM
        <span style="font-weight:400; text-transform:lowercase; font-size:1.1rem; vertical-align:baseline; margin-left:-13px;">
          marking
        </span>
        <span style="color:#F14D68; font-size:1.1rem; vertical-align:super; margin-left:2px;">&reg;</span>
      </span>
    </div>
    <form class="search-bar" id="searchForm" autocomplete="off" style="flex:1; max-width:400px; margin:0 24px;">
      <input type="text" id="searchInput" placeholder="Buscar producto..." />
      <button type="submit" class="search-btn" tabindex="-1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="search-icon" style="width:22px;height:22px;"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </form>
    <div class="navbar-auth">
      <button class="auth-btn" onclick="alert('Registro simulado')">Registrarse</button>
      <button class="auth-btn" onclick="alert('Login simulado')">Iniciar sesión</button>
    </div>
  </nav>
  <!-- PRODUCTOS -->
  <main class="product-section" style="max-width:1250px; margin:34px auto 0 auto; padding:0 5vw;">
    <div class="catalog-title" style="font-size:1.45rem; color:var(--color-principal); font-weight:bold; margin-bottom:18px; letter-spacing:1.5px; text-align:left;">Productos destacados</div>
    <div class="product-grid" id="product-grid"></div>
  </main>
  <script>
    // Productos de ejemplo
    const productoData = [
      { title: "Bolígrafo Metálico", img: "https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?auto=format&fit=crop&w=400&q=80", price: "$250" },
      { title: "Taza Personalizada", img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80", price: "$800" },
      { title: "Mochila Urbana", img: "https://images.unsplash.com/photo-1519125323398-675f0ddb6308?auto=format&fit=crop&w=400&q=80", price: "$3500" },
      { title: "Campera Polar", img: "https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=400&q=80", price: "$4200" },
      { title: "Auriculares Bluetooth", img: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=400&q=80", price: "$2100" },
      { title: "Vaso Térmico Aluminio", img: "https://images.unsplash.com/photo-1465101178521-c1a9136a3b99?auto=format&fit=crop&w=400&q=80", price: "$950" },
      { title: "Gorra Bordada", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80", price: "$1200" },
      { title: "Llavero Metálico", img: "https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=400&q=80", price: "$350" }
    ];
    // Render productos
    function renderProductos() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = "";
      productoData.forEach((prod, idx) => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${prod.img}" alt="${prod.title}">
            <div class="product-name">${prod.title}</div>
            <div class="product-price">${prod.price}</div>
            <div class="counter-bar">
              <button class="counter-btn" onclick="updateCounter(${idx}, -1)" id="btn-minus-${idx}" aria-label="Restar">−</button>
              <input type="text" class="counter-value" id="count-${idx}" value="0" readonly />
              <button class="counter-btn" onclick="updateCounter(${idx}, 1)" id="btn-plus-${idx}" aria-label="Sumar">+</button>
            </div>
            <button class="product-btn" onclick="alert('Ver más de ${prod.title}')">Ver más</button>
          </div>
        `;
      });
    }
    renderProductos();
    // Lógica de suma/resta
    function updateCounter(idx, delta) {
      const input = document.getElementById(`count-${idx}`);
      let value = parseInt(input.value) || 0;
      value = Math.max(0, value + delta);
      input.value = value;
      // Deshabilitar botón menos si es 0
      document.getElementById(`btn-minus-${idx}`).disabled = value === 0;
    }
    // Inicializar botones menos deshabilitados
    window.onload = () => {
      productoData.forEach((_, idx) => {
        document.getElementById(`btn-minus-${idx}`).disabled = true;
      });
    };
  </script>
</body>
</html>
