<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    header {
      background-color: #F75B68;
      padding: 1rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .search-bar {
      margin-top: 0.5rem;
      width: 300px;
      transition: all 0.3s ease;
    }

    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      background-color: #F2F2F2;
      transition: all 0.3s ease;
    }

    .menu-wrapper {
      margin-top: 120px;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    nav.menu {
      display: flex;
      gap: 1.5rem;
    }

    nav.menu a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      transition: color 0.3s;
    }

    nav.menu a:hover {
      color: #F75B68;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 0.5rem;
      margin-top: 0.3rem;
    }

    .submenu a {
      display: block;
      padding: 0.5rem;
      color: #333;
      text-decoration: none;
    }

    .submenu a:hover {
      background-color: #f5f5f5;
    }

    .cart-icon {
      font-size: 1.8rem;
      text-decoration: none;
      color: #333;
    }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 200;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='index.html'">VCM</div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Buscar productos o categorías">
    </div>
  </header>

  <div class="menu-wrapper">
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a href="#" onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#">Mates</a>
          <a href="#">Termos</a>
          <a href="#">Botellas</a>
          <a href="#">Textil</a>
          <a href="#">Accesorios</a>
        </div>
      </div>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
    <a class="cart-icon" href="carrito.html">🛒</a>
  </div>

  <a class="whatsapp-button" href="https://wa.me/5490000000000" target="_blank">📱</a>

  <script>
    function toggleSubmenu() {
      const submenu = document.getElementById("submenu");
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }

    document.addEventListener("click", function (e) {
      const submenu = document.getElementById("submenu");
      const trigger = document.querySelector(".categories-container > a");
      if (!submenu.contains(e.target) && !trigger.contains(e.target)) {
        submenu.style.display = "none";
      }

      const input = document.getElementById("search-input");
      if (!input.contains(e.target)) {
        input.blur();
      }
    });
  </script>
</body>
</html>
