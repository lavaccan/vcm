<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* Estilos generales */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 500px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .menu {
      display: flex;
      gap: 2rem;
      position: relative;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    .categories-container {
      position: relative;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 40px;
      left: 0;
      min-width: 200px;
      z-index: 10;
      border-radius: 10px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      transition: color 0.3s ease, background-color 0.3s ease;
    }

    .submenu a:hover {
      color: #F75B68;
      background-color: #f7f7f7;
      padding-left: 10px;
    }

    .hero {
      background-color: #F75B68;
      color: white;
      text-align: center;
      padding: 2rem;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      margin-top: 2rem;
    }

    .catalog-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      margin-top: 2rem;
    }

    .catalog-item {
      background-color: #F2F2F2;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 200px;
    }

    .catalog-item button {
      background-color: #F75B68;
      border: none;
      padding: 0.5rem;
      color: white;
      font-size: 1.2rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .catalog-item .price {
      font-weight: bold;
      margin-top: 1rem;
    }

    .cart-container {
      margin-top: 2rem;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      padding: 1rem;
      background-color: #F2F2F2;
      border-radius: 10px;
      margin-bottom: 1rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .cart-item .quantity {
      display: flex;
      align-items: center;
    }

    .cart-item .quantity button {
      background-color: #F75B68;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
    }

    .cart-item .price {
      font-weight: bold;
      align-self: center;
    }

  </style>
</head>
<body>

  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías" />
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#">Termos</a>
          <a href="#">Mates</a>
          <a href="#">Bolígrafos</a>
          <a href="#">Botellas</a>
          <a href="#">Indumentaria</a>
        </div>
      </div>
      <a href="cart.html">Carrito</a>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explora nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <section class="catalog-container">
    <div class="catalog-item">
      <h3>Termo VCM</h3>
      <img src="termovcm.jpg" alt="Termo VCM" width="150" />
      <p class="price">$500</p>
      <div class="quantity">
        <button onclick="updateQuantity('termovcm', 'decrease')">-</button>
        <span id="termovcm">0</span>
        <button onclick="updateQuantity('termovcm', 'increase')">+</button>
      </div>
    </div>

    <div class="catalog-item">
      <h3>Mate VCM</h3>
      <img src="matevcm.jpg" alt="Mate VCM" width="150" />
      <p class="price">$200</p>
      <div class="quantity">
        <button onclick="updateQuantity('matevcm', 'decrease')">-</button>
        <span id="matevcm">0</span>
        <button onclick="updateQuantity('matevcm', 'increase')">+</button>
      </div>
    </div>

    <!-- Agregar más productos aquí -->
  </section>

  <script>
    function toggleSubmenu() {
      const submenu = document.getElementById('submenu');
      submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
    }

    // Cierra el menú si se hace clic fuera
    document.addEventListener('click', function(event) {
      const submenu = document.getElementById('submenu');
      const categories = document.querySelector('.categories-container');
      if (!categories.contains(event.target)) {
        submenu.style.display = 'none';
      }
    });

    // Función para actualizar las cantidades de los productos
    function updateQuantity(itemId, action) {
      const itemElement = document.getElementById(itemId);
      let currentQuantity = parseInt(itemElement.innerText);

      if (action === 'increase') {
        itemElement.innerText = currentQuantity + 1;
      } else if (action === 'decrease' && currentQuantity > 0) {
        itemElement.innerText = currentQuantity - 1;
      }
    }
  </script>
</body>
</html>
