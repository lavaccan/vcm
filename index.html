<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VCM - Catálogo de Merchandising</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF; /* Fondo general blanco */
    }
    header {
      background-color: #F75B68; /* Rosa para el logo */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
    }
    .logo img {
      height: 40px;
      margin-right: 10px;
    }
    .logo span {
      font-weight: 700;
      font-size: 1.4rem;
      color: #FFFFFF; /* Texto blanco para el logo */
    }
    .search-bar {
      flex: 1;
      margin: 0 2rem;
    }
    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      color: #777; /* Letras más claras */
      background-color: #F2F2F2; /* Fondo gris claro para la barra de búsqueda */
    }
    .search-bar input::placeholder {
      color: #aaa; /* Placeholder más claro */
    }
    .menu {
      display: flex;
      gap: 3rem; /* Aumenté la distancia entre los botones */
    }
    .menu a {
      color: #FFFFFF; /* Texto blanco para los enlaces */
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .menu a:hover {
      text-decoration: underline;
      color: #F75B68; /* Cambia al color rosa cuando se pasa el cursor */
    }
    .buttons {
      display: flex;
      gap: 1rem;
    }
    .buttons button {
      background-color: #FFFFFF; /* Fondo blanco para los botones */
      color: #2B3A67; /* Texto azul oscuro para los botones */
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      display: none; /* Ocultar los botones "Ingresar" y "Crear cuenta" */
    }
    .hero {
      background: #2B3A67; /* Azul oscuro para el fondo de la sección Hero */
      color: #FFFFFF; /* Texto blanco en la sección Hero */
      padding: 3rem 2rem;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="tu-logo.png" alt="VCM Logo" />
      <span>VCM</span>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Buscá productos o categorías">
    </div>
    <div class="menu">
      <a href="#">Categorías</a>
      <a href="#">Catálogos</a>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </div>
  </header>

  <!-- Sección Hero sin mensaje de descuento -->
  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explora nuestro catálogo de merchandising único y exclusivo.</p>
  </section>
</body>
</html>
