<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 500px;
    }

    .menu {
      display: flex;
      gap: 2rem;
      position: relative;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 40px;
      left: 0;
      min-width: 200px;
      z-index: 10;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
    }

    .categories-container {
      position: relative;
    }

    .hero {
      background-color: #F75B68;
      color: white;
      text-align: center;
      padding: 2rem;
    }

    .slider-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .slider {
      position: relative;
      width: 1628px;
      height: 340px;
      overflow: hidden;
      margin: 4rem auto;
    }

    .slider .slides {
      display: flex;
      transition: transform 1s ease-in-out;
      height: 100%;
    }

    .slider .slide {
      min-width: 100%;
      height: 100%;
    }

    .slider img {
      width: 1628px;
      height: 340px;
      object-fit: cover;
      display: block;
    }

    .slider .prev,
    .slider .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 1rem;
      cursor: pointer;
      font-size: 1.5rem;
      z-index: 1;
    }

    .slider .prev {
      left: 10px;
    }

    .slider .next {
      right: 10px;
    }

    /* GALERÍA DE PRODUCTOS */
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      background-color: #f9f9f9;
    }

    .imagen-contenedor {
      background-color: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .imagen-contenedor:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(245, 98, 117, 0.4);
    }

    .imagen-contenedor img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      background-color: #F75B68;
      color: white;
      padding: 3rem 0;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      margin: 0 1rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías" />
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Categorías</a>
        <div class="submenu" id="submenu">
          <a href="#">Subcategoría 1</a>
          <a href="#">Subcategoría 2</a>
          <a href="#">Subcategoría 3</a>
        </div>
      </div>
      <a href="#">Catálogos</a>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explora nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <div class="slider-wrapper">
    <section class="slider" id="bannerSlider">
      <div class="slides">
        <div class="slide">
          <img src="https://via.placeholder.com/1628x340/FF5733/FFFFFF?text=Banner+1" alt="Banner 1" />
        </div>
        <div class="slide">
          <img src="https://via.placeholder.com/1628x340/33A1FF/FFFFFF?text=Banner+2" alt="Banner 2" />
        </div>
        <div class="slide">
          <img src="https://via.placeholder.com/1628x340/DAF733/FFFFFF?text=Banner+3" alt="Banner 3" />
        </div>
      </div>
      <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
      <button class="next" onclick="moveSlide(1)">&#10095;</button>
    </section>
  </div>

  <!-- GALERÍA DE PRODUCTOS -->
  <section class="galeria">
    <div class="imagen-contenedor"><img src="2.png" alt="Producto 1"></div>
    <div class="imagen-contenedor"><img src="3.png" alt="Producto 2"></div>
    <div class="imagen-contenedor"><img src="4.png" alt="Producto 3"></div>
    <div class="imagen-contenedor"><img src="botellas.png" alt="Producto 4"></div>
    <div class="imagen-contenedor"><img src="Sin título.png" alt="Producto 5"></div>
  </section>

  <footer>
    <p>&copy; 2025 VCM. Todos los derechos reservados.</p>
    <nav>
      <a href="#">Política de privacidad</a>
      <a href="#">Términos de uso</a>
      <a href="#">Contactanos</a>
    </nav>
  </footer>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slider .slide');
    const totalSlides = slides.length;

    function moveSlide(step) {
      currentSlide += step;
      if (currentSlide < 0) currentSlide = totalSlides - 1;
      if (currentSlide >= totalSlides) currentSlide = 0;
      updateSlider();
    }

    function updateSlider() {
      const slider = document.querySelector('.slider .slides');
      const offset = -currentSlide * 1628;
      slider.style.transform = `translateX(${offset}px)`;
    }

    setInterval(() => {
      moveSlide(1);
    }, 10000);

    function toggleSubmenu() {
      const submenu = document.getElementById('submenu');
      submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
    }
  </script>

</body>
</html>
