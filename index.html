<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      gap: 2rem;
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
      margin-right: auto;
    }

    .logo a {
      color: white;
      text-decoration: none;
    }

    .search-bar {
      position: relative;
      transition: all 0.3s ease;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 250px;
      transition: width 0.4s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .search-bar input:focus {
      width: 400px;
      outline: none;
    }

    .cart-icon {
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
    }

    .category-bar {
      background-color: #F75B68;
      padding: 1rem 2rem;
      display: flex;
      gap: 2rem;
      margin-top: 70px;
    }

    .categories-container {
      position: relative;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 40px;
      left: 0;
      min-width: 200px;
      z-index: 10;
      border-radius: 10px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
      background-color: #f7f7f7;
      padding-left: 10px;
    }

    .hero {
      background-color: #F75B68;
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 20px;
    }

    .slider {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 250px;
      margin-top: 20px;
    }

    .slides {
      display: flex;
      transition: transform 1s ease-in-out;
      width: 300%;
    }

    .slides img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: white;
      background-color: rgba(0, 0, 0, 0.3);
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      z-index: 10;
    }

    .arrow.left {
      left: 10px;
    }

    .arrow.right {
      right: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><a href="index.html">VCM</a></div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías" />
    </div>
    <a class="cart-icon" href="carrito.html" title="Ver carrito">🛒</a>
  </header>

  <nav class="category-bar">
    <div class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#">Termos</a>
          <a href="#">Mates</a>
          <a href="#">Bolígrafos</a>
          <a href="#">Botellas</a>
          <a href="#">Indumentaria</a>
        </div>
      </div>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explorá nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <!-- Carrusel -->
  <div class="slider" id="slider">
    <button class="arrow left" onclick="moveSlide(-1)">❮</button>
    <div class="slides" id="slides">
      <img src="https://images.unsplash.com/photo-1558980664-10a5e7470e62" alt="Banner 1">
      <img src="https://images.unsplash.com/photo-1573812041185-1a801c3a81eb" alt="Banner 2">
      <img src="https://images.unsplash.com/photo-1615797311616-05dc636d07bb" alt="Banner 3">
    </div>
    <button class="arrow right" onclick="moveSlide(1)">❯</button>
  </div>
<!-- Ofertas destacadas -->
<section class="highlight-title">
  <h2>Ofertas destacadas</h2>
</section>

<section class="highlight-products" id="highlight-products">
  <!-- Aquí se cargarán los productos desde JSON -->
</section>

<!-- Footer -->
<footer class="footer-bar">
  <a href="#">Ubicación</a>
  <a href="#">Políticas de privacidad</a>
  <a href="mailto:contacto@empresa.com">Contáctanos</a>
  <a href="#">Productos</a>
</footer>

<!-- Botón de WhatsApp -->
<a href="https://wa.me/+5491170983414" class="whatsapp-button" target="_blank" title="Envíanos un mensaje por WhatsApp">
  💬
</a>

<script>
  // Datos simulados (esto debería estar en un archivo .json real)
  const productosDestacados = [
    {
      nombre: "Mochila personalizada",
      imagen: "https://via.placeholder.com/300x180?text=Mochila",
      precio: "$4.500"
    },
    {
      nombre: "Llavero metálico",
      imagen: "https://via.placeholder.com/300x180?text=Llavero",
      precio: "$850"
    },
    {
      nombre: "Taza con logo",
      imagen: "https://via.placeholder.com/300x180?text=Taza",
      precio: "$1.200"
    },
    {
      nombre: "Cuaderno corporativo",
      imagen: "https://via.placeholder.com/300x180?text=Cuaderno",
      precio: "$1.700"
    }
  ];

  const contenedor = document.getElementById("highlight-products");

  productosDestacados.forEach(producto => {
    const card = document.createElement("div");
    card.classList.add("product-card");
    card.innerHTML = `
      <img src="${producto.imagen}" alt="${producto.nombre}">
      <h3>${producto.nombre}</h3>
      <p style="padding: 0 1rem 1rem 1rem; font-weight: bold;">${producto.precio}</p>
    `;
    contenedor.appendChild(card);
  });
</script>

<style>
  .highlight-title {
    padding: 2rem;
    text-align: center;
    background-color: #fff;
  }

  .highlight-title h2 {
    font-size: 2rem;
    color: #F75B68;
    animation: fadeInUp 0.5s ease-out;
  }

  .highlight-products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    padding: 2rem;
    background-color: #f5f5f5;
    animation: fadeIn 1s ease;
  }

  .whatsapp-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #25D366;
    color: white;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 30px;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease;
  }

  .whatsapp-button:hover {
    transform: scale(1.1);
  }

  /* Animaciones estilo Zecat */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
