<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Reset y diseño base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
    }

    header .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    /* Barra de búsqueda sin borde negro y más larga */
    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 400px; /* Aumentado el tamaño */
    }

    /* Menú y submenú */
    .menu {
      display: flex;
      gap: 2rem;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    /* Submenú dentro de Categorías */
    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 50px;
      left: 0;
      min-width: 200px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
    }

    .categories-container {
      position: relative;
    }

    /* Hero Section con color Phantom F75B68 (Rosa) */
    .hero {
      background-color: #F75B68; /* Phantom F75B68 - Rosa */
      color: white;
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
    }

    /* Estilos para el slider */
    .slider {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .slider img {
      width: 100%;
      height: auto;
      display: block;
    }

    .slider .slides {
      display: flex;
      transition: transform 1s ease-in-out;
    }

    .slider .slide {
      min-width: 100%;
    }

    /* Botones para controlar el slider */
    .slider .prev, .slider .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 1rem;
      cursor: pointer;
      font-size: 1.5rem;
      z-index: 1;
    }

    .slider .prev {
      left: 10px;
    }

    .slider .next {
      right: 10px;
    }

    footer {
      background-color: #F75B68;
      color: white;
      padding: 2rem 0;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      margin: 0 1rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header con logo, barra de búsqueda y menú -->
  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías">
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container" id="categories-menu">
        <a href="javascript:void(0)" onclick="toggleSubmenu()">Categorías</a>
        <div class="submenu" id="submenu">
          <a href="#">Subcategoría 1</a>
          <a href="#">Subcategoría 2</a>
          <a href="#">Subcategoría 3</a>
        </div>
      </div>
      <a href="#">Catálogos</a>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
  </header>

  <!-- Hero Section con banner deslizante -->
  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explora nuestro catálogo de merchandising único y exclusivo.</p>
    
    <!-- Slider de imágenes -->
    <div class="slider" id="bannerSlider">
      <div class="slides">
        <div class="slide">
          <img src="https://via.placeholder.com/1200x500/FF5733/FFFFFF?text=Banner+1" alt="Banner 1">
        </div>
        <div class="slide">
          <img src="https://via.placeholder.com/1200x500/33A1FF/FFFFFF?text=Banner+2" alt="Banner 2">
        </div>
        <div class="slide">
          <img src="https://via.placeholder.com/1200x500/DAF733/FFFFFF?text=Banner+3" alt="Banner 3">
        </div>
      </div>
      <!-- Botones para controlar el slider -->
      <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
      <button class="next" onclick="moveSlide(1)">&#10095;</button>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 VCM. Todos los derechos reservados.</p>
    <nav>
      <a href="#">Política de privacidad</a>
      <a href="#">Términos de uso</a>
      <a href="#">Contactanos</a>
    </nav>
  </footer>

  <script>
    // Control del slider
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slider .slide');
    const totalSlides = slides.length;

    function moveSlide(step) {
      currentSlide += step;
      if (currentSlide < 0) currentSlide = totalSlides - 1;
      if (currentSlide >= totalSlides) currentSlide = 0;
      updateSlider();
    }

    function updateSlider() {
      const slider = document.querySelector('.slider .slides');
      const offset = -currentSlide * 100;
      slider.style.transform = `translateX(${offset}%)`;
    }

    // Cambiar el banner automáticamente cada 10 segundos
    setInterval(() => {
      moveSlide(1);
    }, 10000); // Cambiar cada 10 segundos

    // Función para mostrar/ocultar el submenú
    function toggleSubmenu() {
      const submenu = document.getElementById('submenu');
      submenu.style.display = (submenu.style.display === 'block') ? 'none' : 'block';
    }
  </script>

</body>
</html>
