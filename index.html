<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 400px;
    }

    .menu {
      display: flex;
      gap: 1.2rem;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: #fff;
      top: 50px;
      left: 0;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      padding: 1rem;
      border-radius: 10px;
      z-index: 10;
    }

    .submenu a {
      display: block;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
      background-color: #f2f2f2;
      padding-left: 10px;
    }

    .categories-container {
      position: relative;
    }

    .cart-icon {
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
    }

    .hero {
      margin-top: 80px;
      padding: 2rem;
      background-color: #F75B68;
      text-align: center;
      color: white;
    }

    .slider {
      position: relative;
      overflow: hidden;
      max-width: 100%;
    }

    .slides {
      display: flex;
      transition: transform 0.8s ease-in-out;
    }

    .slides img {
      width: 100%;
      flex-shrink: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: white;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 0.5rem;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1;
    }

    .arrow-left { left: 10px; }
    .arrow-right { right: 10px; }

    .products-section {
      padding: 2rem;
      text-align: center;
    }

    .products-section h2 {
      margin-bottom: 2rem;
      color: #F75B68;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .product {
      width: 200px;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .product:hover {
      transform: scale(1.05);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-name {
      padding: 1rem;
      font-weight: bold;
      background-color: #fff;
    }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 30px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías" />
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#" onclick="setCategoryCookie('Termos')">Termos</a>
          <a href="#" onclick="setCategoryCookie('Mates')">Mates</a>
          <a href="#" onclick="setCategoryCookie('Bolígrafos')">Bolígrafos</a>
          <a href="#" onclick="setCategoryCookie('Botellas')">Botellas</a>
          <a href="#" onclick="setCategoryCookie('Indumentaria')">Indumentaria</a>
        </div>
      </div>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
    <a class="cart-icon" href="carrito.html" title="Ver carrito">🛒</a>
  </header>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explorá nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <!-- Carrusel -->
  <div class="slider">
    <div class="arrow arrow-left" onclick="prevSlide()">❮</div>
    <div class="arrow arrow-right" onclick="nextSlide()">❯</div>
    <div class="slides" id="slides">
      <!-- Agregá tus links a Google Fotos aquí -->
      <img src="banner1.jpg" alt="Banner 1">
      <img src="banner2.jpg" alt="Banner 2">
      <img src="banner3.jpg" alt="Banner 3">
    </div>
  </div>

  <!-- Sección de productos -->
  <section class="products-section">
    <h2>Nuestros Productos</h2>
    <div class="products">
      <div class="product"><img src="https://via.placeholder.com/200x180?text=Termo" alt="Termo"><div class="product-name">Termos</div></div>
      <div class="product"><img src="https://via.placeholder.com/200x180?text=Mate" alt="Mate"><div class="product-name">Mates</div></div>
      <div class="product"><img src="https://via.placeholder.com/200x180?text=Bol%C3%ADgrafo" alt="Bolígrafo"><div class="product-name">Bolígrafos</div></div>
      <div class="product"><img src="https://via.placeholder.com/200x180?text=Botella" alt="Botella"><div class="product-name">Botellas</div></div>
      <div class="product"><img src="https://via.placeholder.com/200x180?text=Indumentaria" alt="Indumentaria"><div class="product-name">Indumentaria</div></div>
    </div>
  </section>

  <!-- Botón WhatsApp -->
  <a href="https://wa.me/+5491170983414" class="whatsapp-button" target="_blank" title="Envíanos un mensaje por WhatsApp">💬</a>

  <script>
    function toggleSubmenu() {
      const submenu = document.getElementById('submenu');
      submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
      const submenu = document.getElementById('submenu');
      const categories = document.querySelector('.categories-container');
      if (!categories.contains(event.target)) {
        submenu.style.display = 'none';
      }
    });

    function setCategoryCookie(category) {
      document.cookie = "selectedCategory=" + encodeURIComponent(category) + "; path=/";
    }

    // Carrusel con flechas
    let currentSlide = 0;
    const slides = document.getElementById('slides');
    const totalSlides = slides.children.length;

    function showSlide(index) {
      if (index < 0) index = totalSlides - 1;
      if (index >= totalSlides) index = 0;
      slides.style.transform = `translateX(-${index * 100}%)`;
      currentSlide = index;
    }

    function nextSlide() {
      showSlide(currentSlide + 1);
    }

    function prevSlide() {
      showSlide(currentSlide - 1);
    }

    setInterval(nextSlide, 5000); // Cambia cada 5 segundos
  </script>
</body>
</html>
