<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 400px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .menu {
      display: flex;
      gap: 1.2rem;
      margin-right: 2rem;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 40px;
      left: 0;
      min-width: 200px;
      z-index: 10;
      border-radius: 10px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
      background-color: #f7f7f7;
      padding-left: 10px;
    }

    .categories-container {
      position: relative;
    }

    .cart-icon {
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
    }

    .hero {
      background-color: #F75B68;
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 70px;
    }

    .slider {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 250px;
      margin-top: 20px;
    }

    .slides {
      display: flex;
      transition: transform 1s ease-in-out;
      width: 300%;
    }

    .slides img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      color: white;
      background-color: rgba(0, 0, 0, 0.3);
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      z-index: 10;
    }

    .arrow.left {
      left: 10px;
    }

    .arrow.right {
      right: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías" />
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#">Termos</a>
          <a href="#">Mates</a>
          <a href="#">Bolígrafos</a>
          <a href="#">Botellas</a>
          <a href="#">Indumentaria</a>
        </div>
      </div>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
    <a class="cart-icon" href="carrito.html" title="Ver carrito">🛒</a>
  </header>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explorá nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <!-- Carrusel Ofertas Destacadas -->
  <section id="ofertasDestacadas">
    <h2>Ofertas Destacadas</h2>
    <div class="slider" id="sliderOfertasDestacadas">
      <button class="arrow left" onclick="moveSlide(-1, 'ofertasDestacadas')">❮</button>
      <div class="slides" id="slidesOfertasDestacadas">
        <img src="https://via.placeholder.com/300x180?text=Oferta+1" alt="Oferta 1">
        <img src="https://via.placeholder.com/300x180?text=Oferta+2" alt="Oferta 2">
        <img src="https://via.placeholder.com/300x180?text=Oferta+3" alt="Oferta 3">
      </div>
      <button class="arrow right" onclick="moveSlide(1, 'ofertasDestacadas')">❯</button>
    </div>
  </section>
  <!-- Lo Más Buscado -->
  <section id="loMasBuscado">
    <h2>Lo Más Buscado</h2>
    <div class="slider" id="sliderLoMasBuscado">
      <button class="arrow left" onclick="moveSlide(-1, 'loMasBuscado')">❮</button>
      <div class="slides" id="slidesLoMasBuscado">
        <img src="https://via.placeholder.com/300x180?text=Termo+1" alt="Termo 1">
        <img src="https://via.placeholder.com/300x180?text=Termo+2" alt="Termo 2">
        <img src="https://via.placeholder.com/300x180?text=Termo+3" alt="Termo 3">
      </div>
      <button class="arrow right" onclick="moveSlide(1, 'loMasBuscado')">❯</button>
    </div>
  </section>

  <!-- Barra gris con enlaces -->
  <div class="footer-bar">
    <a href="#">Términos y condiciones</a>
    <a href="#">Política de privacidad</a>
    <a href="#">Contáctanos</a>
  </div>

  <a href="https://wa.me/549XXXXXXXXX" class="whatsapp-button" target="_blank">📲</a>

  <script>
    let currentSlideOfertasDestacadas = 0;
    let currentSlideLoMasBuscado = 0;

    function moveSlide(direction, section) {
      if (section === 'ofertasDestacadas') {
        const slides = document.getElementById('slidesOfertasDestacadas');
        const totalSlides = slides.children.length;
        currentSlideOfertasDestacadas = (currentSlideOfertasDestacadas + direction + totalSlides) % totalSlides;
        slides.style.transform = `translateX(-${currentSlideOfertasDestacadas * 100}%)`;
      } else if (section === 'loMasBuscado') {
        const slides = document.getElementById('slidesLoMasBuscado');
        const totalSlides = slides.children.length;
        currentSlideLoMasBuscado = (currentSlideLoMasBuscado + direction + totalSlides) % totalSlides;
        slides.style.transform = `translateX(-${currentSlideLoMasBuscado * 100}%)`;
      }
    }
  </script>

</body>
</html>
