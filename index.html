<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCM</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .fade-slide {
      animation: slideIn 0.2s ease-out;
    }

    .search-history {
      @apply absolute bg-white border border-gray-300 rounded-lg shadow-lg w-full max-h-60 overflow-y-auto z-50;
    }

    .search-history div {
      @apply p-2 text-black cursor-pointer hover:bg-gray-100;
    }

    .search-bar {
      @apply transition-all duration-300 ease-in-out pl-10 p-3 w-full rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500;
    }

    .search-bar:focus {
      @apply pl-4;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto p-4">
    <div class="relative max-w-xl mx-auto">
      <input
        id="searchInput"
        type="text"
        placeholder="Buscar productos..."
        class="search-bar"
        onfocus="showSearchHistory()"
        oninput="updateSearchHistory(this.value)"
        onclick="showSearchHistory()"
      />
      <svg class="w-5 h-5 absolute left-3 top-3 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>

      <div id="searchHistory" class="search-history hidden fade-slide"></div>
    </div>
  </div>

  <script>
    function updateSearchHistory(value) {
      if (!value.trim()) return;

      let history = JSON.parse(localStorage.getItem('searchHistory')) || [];
      if (!history.includes(value)) {
        history.unshift(value);
        if (history.length > 10) history.pop();
        localStorage.setItem('searchHistory', JSON.stringify(history));
      }
      renderSearchHistory();
    }

    function renderSearchHistory() {
      const history = JSON.parse(localStorage.getItem('searchHistory')) || [];
      const container = document.getElementById('searchHistory');
      container.innerHTML = '';

      history.forEach(item => {
        const entry = document.createElement('div');
        entry.textContent = item;
        entry.onclick = () => {
          document.getElementById('searchInput').value = item;
          container.classList.add('hidden');
        };
        container.appendChild(entry);
      });
    }

    function showSearchHistory() {
      renderSearchHistory();
      document.getElementById('searchHistory').classList.remove('hidden');
    }

    document.addEventListener('click', (e) => {
      const input = document.getElementById('searchInput');
      const history = document.getElementById('searchHistory');
      if (!input.contains(e.target) && !history.contains(e.target)) {
        history.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
