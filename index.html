<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      width: 500px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .menu {
      display: flex;
      gap: 1.2rem;
      margin-right: 2rem;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .menu a:hover {
      text-decoration: underline;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: #FFFFFF;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 1rem;
      top: 40px;
      left: 0;
      min-width: 200px;
      z-index: 10;
      border-radius: 10px;
    }

    .submenu a {
      color: #333;
      text-decoration: none;
      display: block;
      margin-bottom: 0.5rem;
    }

    .submenu a:hover {
      color: #F75B68;
      background-color: #f7f7f7;
      padding-left: 10px;
    }

    .categories-container {
      position: relative;
    }

    .cart-icon {
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
    }

    .hero {
      background-color: #F75B68;
      color: white;
      text-align: center;
      padding: 2rem;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      margin-top: 2rem;
    }

    .slider {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 100%;
      margin-top: 20px;
    }

    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
      width: 300%;
    }

    .slides a {
      width: 100%;
      display: block;
    }

    .slides img {
      width: 100%;
      height: auto;
      display: block;
    }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 30px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VCM</div>
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos o categorías" />
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#" onclick="setCategoryCookie('Termos')">Termos</a>
          <a href="#" onclick="setCategoryCookie('Mates')">Mates</a>
          <a href="#" onclick="setCategoryCookie('Bolígrafos')">Bolígrafos</a>
          <a href="#" onclick="setCategoryCookie('Botellas')">Botellas</a>
          <a href="#" onclick="setCategoryCookie('Indumentaria')">Indumentaria</a>
        </div>
      </div>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
    <a class="cart-icon" href="carrito.html" title="Ver carrito">🛒</a>
  </header>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explora nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <!-- Carrusel con enlaces -->
  <div class="slider" id="slider">
    <div class="slides">
      <a href="https://photos.google.com/tu-enlace-1" target="_blank">
        <img src="banner1.jpg" alt="Banner 1">
      </a>
      <a href="https://photos.google.com/tu-enlace-2" target="_blank">
        <img src="banner2.jpg" alt="Banner 2">
      </a>
      <a href="https://photos.google.com/tu-enlace-3" target="_blank">
        <img src="banner3.jpg" alt="Banner 3">
      </a>
    </div>
  </div>

  <!-- Botón de WhatsApp -->
  <a href="https://wa.me/+5491170983414" class="whatsapp-button" target="_blank" title="Envíanos un mensaje por WhatsApp">
    💬
  </a>

  <script>
    function toggleSubmenu() {
      const submenu = document.getElementById('submenu');
      submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
      const submenu = document.getElementById('submenu');
      const categories = document.querySelector('.categories-container');
      if (!categories.contains(event.target)) {
        submenu.style.display = 'none';
      }
    });

    function setCategoryCookie(category) {
      document.cookie = "selectedCategory=" + encodeURIComponent(category) + "; path=/";
    }

    // Carrusel automático
    let currentSlide = 0;
    const slides = document.querySelector('.slides');
    const totalSlides = slides.children.length;

    setInterval(() => {
      currentSlide = (currentSlide + 1) % totalSlides;
      slides.style.transform = `translateX(-${currentSlide * 100}%)`;
    }, 4000);
  </script>

</body>
</html>
