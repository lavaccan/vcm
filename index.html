<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VCM - Catálogo de Merchandising</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #FFFFFF;
      color: #333;
    }

    header {
      background-color: #F75B68;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      color: white;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .search-bar {
      position: relative;
      max-width: 400px;
      flex-grow: 1;
      margin: 0 1rem;
      transition: all 0.3s ease;
    }

    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      color: #777;
      background-color: #F2F2F2;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .search-bar input:focus {
      outline: none;
      background-color: #FFF;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .search-suggestions {
      display: none;
      position: absolute;
      width: 100%;
      top: 110%;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      z-index: 20;
    }

    .search-suggestions div {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    .search-suggestions div:hover {
      background-color: #f2f2f2;
    }

    .menu {
      display: flex;
      gap: 1.2rem;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 600;
    }

    .categories-container {
      position: relative;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: white;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 1rem;
      top: 40px;
      left: 0;
      min-width: 200px;
      z-index: 10;
    }

    .submenu a {
      display: block;
      color: #333;
      margin-bottom: 0.5rem;
      text-decoration: none;
    }

    .submenu a:hover {
      color: #F75B68;
      background-color: #f7f7f7;
      padding-left: 10px;
    }

    .cart-icon {
      font-size: 1.5rem;
      text-decoration: none;
      color: white;
    }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      border-radius: 50%;
      padding: 15px;
      color: white;
      font-size: 24px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    .whatsapp-button:hover {
      background-color: #128C7E;
    }

    .hero {
      background-color: #F75B68;
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 70px;
    }

    .slider {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 250px;
      margin-top: 20px;
    }

    .slides {
      display: flex;
      width: 300%;
      transition: transform 1s ease-in-out;
    }

    .slides img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2rem;
      background-color: rgba(0, 0, 0, 0.3);
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      z-index: 10;
      cursor: pointer;
    }

    .arrow.left {
      left: 10px;
    }

    .arrow.right {
      right: 10px;
    }

    .category-carousel {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      margin-top: 2rem;
      overflow-x: auto;
    }

    .category-carousel img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='index.html'">VCM</div>
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Buscar productos o categorías" onfocus="showSuggestions()" />
      <div class="search-suggestions" id="suggestions">
        <div onclick="selectSuggestion('Mates')">Mates</div>
        <div onclick="selectSuggestion('Termos')">Termos</div>
        <div onclick="selectSuggestion('Botellas')">Botellas</div>
        <div onclick="selectSuggestion('Remeras')">Remeras</div>
      </div>
    </div>
    <nav class="menu">
      <a href="#">Inicio</a>
      <div class="categories-container">
        <a onclick="toggleSubmenu()">Catálogo</a>
        <div class="submenu" id="submenu">
          <a href="#">Termos</a>
          <a href="#">Mates</a>
          <a href="#">Bolígrafos</a>
          <a href="#">Botellas</a>
          <a href="#">Indumentaria</a>
        </div>
      </div>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </nav>
    <a class="cart-icon" href="carrito.html" title="Ver carrito">🛒</a>
  </header>

  <section class="hero">
    <h1>Bienvenidos a VCM</h1>
    <p>Explorá nuestro catálogo de merchandising único y exclusivo.</p>
  </section>

  <a href="https://wa.me/+5491131904180" class="whatsapp-button" target="_blank">📲</a>

  <section class="slider" id="bannerSlider">
    <div class="slides" id="slidesBanners">
      <img src="https://via.placeholder.com/1200x400?text=Banner+1" alt="Banner 1">
      <img src="https://via.placeholder.com/1200x400?text=Banner+2" alt="Banner 2">
      <img src="https://via.placeholder.com/1200x400?text=Banner+3" alt="Banner 3">
    </div>
    <button class="arrow left" onclick="moveSlide(-1, 'banners')">❮</button>
    <button class="arrow right" onclick="moveSlide(1, 'banners')">❯</button>
  </section>

  <section id="masBuscados">
    <h2>Lo Más Buscado</h2>
    <div class="category-carousel">
      <img src="https://via.placeholder.com/200x150?text=Mates" alt="Mate">
      <img src="https://via.placeholder.com/200x150?text=Termos" alt="Termo">
      <img src="https://via.placeholder.com/200x150?text=Botellas" alt="Botella">
      <img src="https://via.placeholder.com/200x150?text=Indumentaria" alt="Indumentaria">
    </div>
  </section>

  <section id="ofertasDestacadas">
    <h2>Ofertas Destacadas</h2>
    <div class="slider">
      <button class="arrow left" onclick="moveSlide(-1, 'ofertasDestacadas')">❮</button>
      <div class="slides" id="slidesOfertasDestacadas">
        <img src="https://via.placeholder.com/300x180?text=Oferta+1" alt="Oferta 1">
        <img src="https://via.placeholder.com/300x180?text=Oferta+2" alt="Oferta 2">
        <img src="https://via.placeholder.com/300x180?text=Oferta+3" alt="Oferta 3">
      </div>
      <button class="arrow right" onclick="moveSlide(1, 'ofertasDestacadas')">❯</button>
    </div>
  </section>

  <script>
    let currentSlideBanners = 0;
    let currentSlideOfertasDestacadas = 0;

    function moveSlide(direction, section) {
      const slides = document.getElementById(section === 'banners' ? 'slidesBanners' : 'slidesOfertasDestacadas');
      const totalSlides = slides.children.length;
      let current = section === 'banners' ? currentSlideBanners : currentSlideOfertasDestacadas;

      const next = (current + direction + totalSlides) % totalSlides;
      slides.style.transform = `translateX(-${next * 100}%)`;

      if (section === 'banners') currentSlideBanners = next;
      else currentSlideOfertasDestacadas = next;
    }

    function toggleSubmenu() {
      const submenu = document.getElementById('submenu');
      submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
    }

    window.addEventListener('click', function(e) {
      const submenu = document.getElementById('submenu');
      const categoriesContainer = document.querySelector('.categories-container');
      const searchBar = document.getElementById('searchBar');
      const suggestions = document.getElementById('suggestions');

      if (!categoriesContainer.contains(e.target)) submenu.style.display = 'none';
      if (!searchBar.contains(e.target)) suggestions.style.display = 'none';
    });

    function showSuggestions() {
      document.getElementById('suggestions').style.display = 'block';
    }

    function selectSuggestion(value) {
      document.getElementById('searchInput').value = value;
      document.getElementById('suggestions').style.display = 'none';
    }

    setInterval(() => moveSlide(1, 'banners'), 3000);
  </script>
</body>
</html>
