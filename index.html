<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VCM - Catálogo de Merchandising</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #f7f7f7;
    }
    header {
      background-color: #f86b67;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
    }
    .logo img {
      height: 40px;
      margin-right: 10px;
    }
    .logo span {
      font-weight: 700;
      font-size: 1.4rem;
      color: white;
    }
    .search-bar {
      flex: 1;
      margin: 0 2rem;
    }
    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
    }
    .menu {
      display: flex;
      gap: 1.5rem;
    }
    .menu a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }
    .menu a:hover {
      text-decoration: underline;
    }
    .buttons {
      display: flex;
      gap: 1rem;
    }
    .buttons button {
      background-color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
    }
    .hero {
      background: #0077b6;
      color: white;
      padding: 3rem 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="tu-logo.png" alt="VCM Logo" />
      <span>VCM</span>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Buscá productos o categorías">
    </div>
    <div class="menu">
      <a href="#">Categorías</a>
      <a href="#">Catálogos</a>
      <a href="#">Nosotros</a>
      <a href="#">Ayuda</a>
    </div>
    <div class="buttons">
      <button>Ingresá</button>
      <button>Creá tu cuenta</button>
    </div>
  </header>

  <section class="hero">
    <h1>¡SALE! HASTA 30% OFF</h1>
    <p>Descuentos adicionales en productos seleccionados</p>
  </section>
</body>
</html>
